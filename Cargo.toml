[package]
name = "gltf-linux-preview"
version = "0.1.0"
edition = "2021"
description = "A simple glTF and GLB previewer for Linux."
license = "MIT"
repository = "https://github.com/allanbatista/gltf-linux-preview"
readme = "README.md"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["default_app", "3d_api", "3d_bevy_render", "scene", "bevy_winit", "x11", "jpeg", "tga"] }
