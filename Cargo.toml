[package]
name = "gltf-linux-preview"
version = "0.1.2"
edition = "2021"
description = "A simple glTF and GLB previewer for Linux."
license = "MIT"
repository = "https://github.com/allanbatista/gltf-linux-preview"
readme = "README.md"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["default_app", "3d_api", "3d_bevy_render", "scene", "bevy_winit", "x11", "jpeg", "png", "tga"] }
bevy_egui = { version = "0.41", default-features = false, features = ["render", "default_fonts"] }
bevy_obj = "0.19"
